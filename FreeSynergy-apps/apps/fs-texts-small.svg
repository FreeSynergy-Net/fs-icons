<!-- FreeSynergy program icon (small, for 16 and 24 px): fs-texts. Simplified own drawing: one page only, bold strokes on the 16 px grid. SPDX-License-Identifier: MIT -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#tile)"/>
  <!-- page with folded corner -->
  <path d="M4 2h5l3 3v9H4z" fill="#FFFFFF"/>
  <path d="M9 2v3h3z" fill="#A5B4FC"/>
  <!-- two bold text lines, 2 px high -->
  <rect x="6" y="7" width="4" height="2" fill="#4F46E5"/>
  <rect x="6" y="10" width="4" height="2" fill="#4F46E5"/>
</svg>
